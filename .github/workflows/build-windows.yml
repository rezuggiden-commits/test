name: Validate own C++ Noma UI (no release)
on:
  workflow_dispatch:
  push:
    paths: ['shieldbrowser-source.zip', '.github/workflows/build-windows.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify source and extract
        shell: powershell
        run: |
          if ((Get-FileHash shieldbrowser-source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '938e07fe2aba5c7e181a86b5b01501278dadd9f05cd2d557a67687c2adf29447') { throw 'Source SHA256 mismatch' }
          Expand-Archive shieldbrowser-source.zip -DestinationPath . -Force
      - name: Build and test own C++ Qt and CEF UI
        shell: powershell
        run: ./NomaDesktop/tools/ci_windows.ps1
      - name: Upload test evidence only (not a browser release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Noma-native-validation
          path: |
            NomaDesktop/docs/runtime/
            NomaDesktop/build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
