name: Build ShieldBrowser Windows EXE
on:
  workflow_dispatch:
  push:
    paths: ['shieldbrowser-source.zip', '.github/workflows/build-windows.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and extract project source
        shell: powershell
        run: |
          $expected = '80d3297618f040e51d97fdd0dc1da9fcb6f6e50d65ea610eac3fee55a1fd9545'
          if ((Get-FileHash shieldbrowser-source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Source SHA256 mismatch' }
          Expand-Archive shieldbrowser-source.zip -DestinationPath . -Force
      - name: Build, test and package real Qt CEF browser
        shell: powershell
        run: ./ShieldBrowser/tools/ci_windows.ps1
      - name: Upload Windows portable browser
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ShieldBrowser-Windows-x64
          path: |
            ShieldBrowser/dist/ShieldBrowser-Windows-x64-portable.zip
            ShieldBrowser/dist/START-HERE.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic logs and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ShieldBrowser-build-diagnostics
          path: |
            ShieldBrowser/docs/
            ShieldBrowser/build/Testing/
            ShieldBrowser/build/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
      - name: Publish tested preview
        if: success()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.0-preview.$env:GITHUB_RUN_NUMBER"
          $zip = 'ShieldBrowser/dist/ShieldBrowser-Windows-x64-portable.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ShieldBrowser-Windows-x64-portable.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
          gh release create $tag $zip shieldbrowser-source.zip SHA256SUMS.txt --title "ShieldBrowser 0.2.0 Preview" --prerelease --notes "Redesigned native browser UI, dark/light themes, local new-tab page, inline find, tab shortcuts. Windows build, core tests and real CEF UI smoke tests passed. Preview software; no automatic updater. Extract the entire portable ZIP and run ShieldBrowser.exe."
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
