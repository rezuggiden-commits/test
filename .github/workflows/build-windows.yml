name: Validate own C++ Noma UI (no release)
on:
  workflow_dispatch:
  push:
    paths: ['noma-native-source.zip', '.github/workflows/build-windows.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify source and extract
        shell: powershell
        run: |
          if ((Get-FileHash noma-native-source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '19a527971969564eda8516ee1400815adf4c36e8cf08e6cd6403ceedf0934ea0') { throw 'Source SHA256 mismatch' }
          Expand-Archive noma-native-source.zip -DestinationPath . -Force
      - name: Build and test own C++ Qt and CEF UI
        shell: powershell
        run: ./NomaDesktop/tools/ci_windows.ps1
      - name: Upload test evidence only (not a browser release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Noma-native-validation
          path: |
            NomaDesktop/docs/runtime/
            NomaDesktop/build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: Store unsigned installer after all validation passes
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Noma-Windows-validation-installer-unsigned
          path: |
            NomaDesktop/dist/installers/*.exe
            NomaDesktop/dist/installers/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
