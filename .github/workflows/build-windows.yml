name: Build and verify Noma Windows
on:
  workflow_dispatch:
  push:
    paths: ['shieldbrowser-source.zip', '.github/workflows/build-windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify source and extract
        shell: powershell
        run: |
          $expected = '1915ff84748c494bf24cf8bc7a82cd92d33973f0e9a2e6b000b587342b9bfca5'
          if ((Get-FileHash shieldbrowser-source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Source SHA256 mismatch' }
          Expand-Archive shieldbrowser-source.zip -DestinationPath . -Force
      - name: Native Chromium tests and Windows package
        shell: powershell
        run: ./Noma/tools/ci_windows.ps1
      - name: Upload candidate (not an automatic release)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Noma-Windows-candidate
          path: |
            Noma/dist/Noma-Windows-x64-portable.zip
            Noma/dist/SHA256.txt
          if-no-files-found: error
      - name: Upload actual runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Noma-runtime-evidence
          path: Noma/docs/runtime/
          if-no-files-found: warn
